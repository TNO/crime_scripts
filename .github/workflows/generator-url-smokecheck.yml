name: Generator URL smokecheck

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public source URL to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch public URL
        env:
          SOURCE_URL: ${{ inputs.url }}
        run: |
          resolved="$(
            node --input-type=module <<'NODE'
          import { lookup } from 'node:dns/promises';
          import { isIP } from 'node:net';
          const url = new URL(process.env.SOURCE_URL);
          if (
            url.protocol !== 'https:' || (url.port && url.port !== '443') ||
            url.username || url.password || isIP(url.hostname)
          ) {
            throw new Error(
              'Only credential-free HTTPS URLs on port 443 with a DNS hostname are accepted.'
            );
          }
          const addresses = await lookup(url.hostname, { all: true });
          const blocked = addresses.find(({ address, family }) => {
            if (family === 4) {
              const [a, b] = address.split('.').map(Number);
              return a === 10 || a === 127 || a === 0 || (a === 169 && b === 254) ||
                (a === 100 && b >= 64 && b <= 127) ||
                (a === 172 && b >= 16 && b <= 31) ||
                (a === 192 && [0, 2, 88, 168].includes(b)) ||
                (a === 198 && [18, 19, 51].includes(b)) ||
                (a === 203 && b === 0) || a >= 224;
            }
            const value = address.toLowerCase();
            return !/^[23]/.test(value) || value.startsWith('2001:db8:');
          });
          if (!addresses.length || blocked) throw new Error('URL resolves to a non-public address.');
          const selected = addresses.find(({ family }) => family === 4) || addresses[0];
          process.stdout.write(
            `${url.hostname}\n${selected.family === 6 ? `[${selected.address}]` : selected.address}`
          );
          NODE
          )"
          host="$(printf '%s\n' "$resolved" | sed -n '1p')"
          address="$(printf '%s\n' "$resolved" | sed -n '2p')"
          curl --fail --max-time 30 \
            --proto '=https' \
            --proto-redir '=https' \
            --resolve "${host}:443:${address}" \
            --user-agent "crime-script-generator-source-check/1.0" \
            --output response.bin \
            --dump-header response.headers \
            "$SOURCE_URL"
          test -s response.bin
          head -20 response.headers
