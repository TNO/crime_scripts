name: Generator release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            binary: crime-script-generator
          - runner: macos-14
            platform: macos-arm64
            binary: crime-script-generator
          - runner: windows-2025
            platform: windows-x64
            binary: crime-script-generator.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d3f86a106a0bac45b974a628896c90dbdf5c8093
      - uses: pnpm/action-setup@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crime-script/generator test
      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./packages/script-generator/package.json').version")"
          test "$GITHUB_REF_NAME" = "v${version}"
      - name: Build binary
        shell: bash
        run: |
          architecture="$(uname -m)"
          case "${{ matrix.platform }}" in
            macos-arm64) test "$architecture" = "arm64" ;;
            linux-x64|windows-x64) test "$architecture" = "x86_64" ;;
          esac
          mkdir -p release/bin
          bun build --compile --minify \
            --outfile "release/bin/${{ matrix.binary }}" \
            packages/script-generator/src/cli.ts
      - name: Smoke test binary
        shell: bash
        run: "./release/bin/${{ matrix.binary }} --version"
      - name: Stage release files
        shell: bash
        run: |
          package="crime-script-generator-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "release/${package}"
          cp "release/bin/${{ matrix.binary }}" "release/${package}/"
          cp -R .agents/skills/crime-script-generator "release/${package}/skill"
          cp -R packages/gui/public/icons "release/${package}/icons"
          node packages/script-generator/scripts/write-checksums.mjs "release/${package}"
          printf '%s\n' "$package" > "release/package-name.txt"
      - name: Create archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="$(cat release/package-name.txt)"
          (cd release && zip -qr "${package}.zip" "${package}")
      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-Content release/package-name.txt
          Compress-Archive -Path "release/$package" -DestinationPath "release/$package.zip"
      - uses: actions/upload-artifact@11d5960a326750d5838078e36cf38b85af677262
        with:
          name: crime-script-generator-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          pattern: crime-script-generator-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS --generate-notes
